# ==========================================================
# Student Complaint Management System - Docker Compose
# Orchestrates 3 services: Database, Backend API, Reverse Proxy
# ==========================================================

services:
  # 1. Database Service: MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: scms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: student_complaint_system
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-initializes schema and seed data on first container startup
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - scms_network

  # 2. Backend Application Service: Node.js + Express
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scms_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword123}
      DB_NAME: student_complaint_system
      JWT_SECRET: ${JWT_SECRET:-complaint_system_dev_secret_key_btech_2026_xyz987}
      JWT_EXPIRES_IN: 24h
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - scms_network

  # 3. Web Server & Reverse Proxy: Nginx
  nginx:
    image: nginx:alpine
    container_name: scms_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - scms_network

# Persistent Docker Volumes
volumes:
  mysql_data:
    driver: local

# Isolated Docker Bridge Network
networks:
  scms_network:
    driver: bridge
