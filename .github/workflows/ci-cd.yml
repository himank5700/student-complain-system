name: SCMS CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ========================================================
  # Job 1: Test & Lint Node.js Backend
  # ========================================================
  test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20.x Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 3. Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 4. Run Automated Jest & Supertest Tests
        working-directory: ./backend
        run: npm test

  # ========================================================
  # Job 2: Build & Validate Docker Containers
  # ========================================================
  docker-build:
    name: Build & Verify Docker Images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Build Backend Docker Image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag student-complaint-system-backend:${{ github.sha }} \
            .

      - name: 4. Validate Docker Compose Configuration
        run: docker compose config
