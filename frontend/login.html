<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Student Complaint Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-mortarboard-fill text-primary fs-3"></i>
        <span>CampusGrievance</span>
      </a>
      <div class="ms-auto">
        <a href="register.html" class="btn btn-outline-primary btn-sm">Create Student Account</a>
      </div>
    </div>
  </nav>

  <!-- Login Main Container -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="custom-card p-4 p-md-5 bg-white shadow">
          <div class="text-center mb-4">
            <div class="stats-icon bg-primary bg-opacity-10 text-primary mx-auto mb-2">
              <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h3 class="fw-bold">Welcome Back</h3>
            <p class="text-muted small">Sign in to your Student or Administrator portal</p>
          </div>

          <!-- Alert Container for Feedback -->
          <div id="alert-container"></div>

          <!-- Demo Quick-Fill Buttons -->
          <div class="p-3 bg-light rounded-3 mb-4 border">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="small fw-semibold text-secondary"><i class="bi bi-lightning-charge-fill text-warning"></i> Demo Quick-Fill</span>
              <span class="badge bg-secondary">For Evaluation</span>
            </div>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-outline-primary flex-fill" onclick="fillCredentials('student@college.edu', 'Student@123')">
                <i class="bi bi-person me-1"></i> Student Login
              </button>
              <button type="button" class="btn btn-sm btn-outline-danger flex-fill" onclick="fillCredentials('admin@college.edu', 'Admin@123')">
                <i class="bi bi-shield-lock me-1"></i> Admin Login
              </button>
            </div>
          </div>

          <!-- Login Form -->
          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label fw-medium">College Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control" id="email" placeholder="name@college.edu" required autocomplete="email">
              </div>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center">
                <label for="password" class="form-label fw-medium mb-0">Password</label>
              </div>
              <div class="input-group mt-1">
                <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
              </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100 py-2">
              <span id="btnText"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <p class="text-muted small mb-1">Are you a new student?</p>
            <a href="register.html" class="fw-semibold text-primary text-decoration-none">Register for an account</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-auto">
    <div class="container text-center">
      <p class="text-muted small mb-0">Student Complaint Management System &bull; Secure JWT Authentication</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application JS -->
  <script src="js/app.js"></script>

  <script>
    // Autofill helper for quick testing
    function fillCredentials(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
    }

    // Handle Login Form Submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      // Set Loading state
      submitBtn.disabled = true;
      btnText.classList.add('d-none');
      btnSpinner.classList.remove('d-none');

      try {
        const response = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Login failed. Please verify credentials.');
        }

        // Store token & user payload in localStorage
        setAuthData(data.token, data.user);

        showAlert('alert-container', 'Login successful! Redirecting to dashboard...', 'success');

        // Redirect based on user role
        setTimeout(() => {
          if (data.user.role === 'admin') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'student-dashboard.html';
          }
        }, 800);

      } catch (error) {
        showAlert('alert-container', error.message, 'danger');
      } finally {
        submitBtn.disabled = false;
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
