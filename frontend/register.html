<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Campus Grievance Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-mortarboard-fill text-primary fs-3"></i>
        <span>CampusGrievance</span>
      </a>
      <div class="ms-auto">
        <a href="login.html" class="btn btn-outline-primary btn-sm">Already have an account? Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Register Container -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="custom-card p-4 p-md-5 bg-white shadow">
          <div class="text-center mb-4">
            <div class="stats-icon bg-primary bg-opacity-10 text-primary mx-auto mb-2">
              <i class="bi bi-person-badge-fill fs-2"></i>
            </div>
            <h3 class="fw-bold">Student Registration</h3>
            <p class="text-muted small">Create an account to submit and track college grievances</p>
          </div>

          <div id="alert-container"></div>

          <form id="registerForm">
            <div class="mb-3">
              <label for="name" class="form-label fw-medium">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
                <input type="text" class="form-control" id="name" placeholder="e.g. Rahul Sharma" required minlength="2">
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-medium">College Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control" id="email" placeholder="e.g. rahul@college.edu" required>
              </div>
              <div class="form-text">Must be a valid email format.</div>
            </div>

            <div class="mb-3">
              <label for="department" class="form-label fw-medium">Academic Department</label>
              <select class="form-select" id="department" required>
                <option value="Computer Science & Engineering" selected>Computer Science & Engineering</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electronics & Communication">Electronics & Communication</option>
                <option value="Electrical & Electronics">Electrical & Electronics</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Civil Engineering">Civil Engineering</option>
                <option value="Applied Sciences">Applied Sciences</option>
              </select>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="password" class="form-label fw-medium">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Min 6 characters" required minlength="6">
              </div>
              <div class="col-md-6 mb-3">
                <label for="confirmPassword" class="form-label fw-medium">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" required minlength="6">
              </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100 py-2 mt-2">
              <span id="btnText"><i class="bi bi-check-circle me-1"></i> Complete Registration</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <p class="text-muted small mb-0">Already registered? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Sign in here</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-auto">
    <div class="container text-center">
      <p class="text-muted small mb-0">Student Complaint Management System &bull; Secure Registration</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application JS -->
  <script src="js/app.js"></script>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const department = document.getElementById('department').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showAlert('alert-container', 'Passwords do not match. Please re-enter carefully.', 'warning');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      submitBtn.disabled = true;
      btnText.classList.add('d-none');
      btnSpinner.classList.remove('d-none');

      try {
        const response = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, department, role: 'student' })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Registration failed.');
        }

        setAuthData(data.token, data.user);
        showAlert('alert-container', 'Account registered successfully! Redirecting...', 'success');

        setTimeout(() => {
          window.location.href = 'student-dashboard.html';
        }, 900);

      } catch (error) {
        showAlert('alert-container', error.message, 'danger');
      } finally {
        submitBtn.disabled = false;
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
